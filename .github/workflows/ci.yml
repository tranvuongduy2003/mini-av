name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Format, vet, and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($unformatted) {
            Write-Output "The following files need gofmt:"
            Write-Output $unformatted
            exit 1
          }

      - name: Verify allowed direct dependencies
        shell: pwsh
        run: |
          $allowed = @(
            "google.golang.org/grpc"
            "google.golang.org/protobuf"
          )
          $direct = @(
            go list -m -f '{{if and (not .Main) (not .Indirect)}}{{.Path}}{{end}}' all |
              Where-Object { $_ }
          )
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $unexpected = @($direct | Where-Object { $_ -notin $allowed })
          $missing = @($allowed | Where-Object { $_ -notin $direct })
          if ($unexpected) {
            Write-Output "Unexpected direct Go modules:"
            Write-Output $unexpected
            exit 1
          }
          if ($missing) {
            Write-Output "Required direct Go modules are missing:"
            Write-Output $missing
            exit 1
          }

      - name: Vet
        shell: pwsh
        run: |
          $packages = go list ./... 2>$null
          if (-not $packages) {
            Write-Output "No Go packages yet; skipping vet."
            exit 0
          }
          go vet ./...
          exit $LASTEXITCODE

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        shell: pwsh
        run: |
          $packages = go list ./... 2>$null
          if (-not $packages) {
            Write-Output "No Go packages yet; skipping tests."
            exit 0
          }
          go test ./...
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          go test -race ./...
          exit $LASTEXITCODE
